<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento PIX • SamSolution</title><link rel="stylesheet" href="style-premium.css">
<style>.wrap{width:min(700px,92%);margin:auto;padding:50px 0}.qr{display:block;width:min(420px,100%);margin:20px auto;background:#fff;padding:10px;border-radius:12px}.copy{word-break:break-all;background:#080c12;border:1px solid #303b4c;padding:14px;border-radius:10px;color:#b8c1ce;font-size:11px}.status{margin:18px 0;padding:14px;border-radius:10px;border:1px solid #293446}.success{border-color:#236c53;background:#0a2019;color:#83ffd0}.code{font-size:24px;font-weight:900;padding:18px;background:#0a0f16;border-radius:10px;margin-top:10px;letter-spacing:1px}</style></head><body>
<main class="wrap"><div class="card" style="padding:28px"><div class="section-kicker">MERCADO PAGO • PIX</div><h1>Finalize seu pagamento</h1><p class="fine">Escaneie o QR Code ou copie o Pix Copia e Cola.</p><div id="loading">Carregando…</div><img id="qr" class="qr" hidden><div id="copybox" class="copy" hidden></div><button id="copy" class="btn btn-primary" hidden>Copiar PIX</button><div id="status" class="status">Aguardando pagamento…</div><div id="delivery" hidden></div></div></main>
<script>
const d=JSON.parse(sessionStorage.getItem("samsolution_order")||"null");
const loading=document.getElementById("loading"),img=document.getElementById("qr"),box=document.getElementById("copybox"),copy=document.getElementById("copy"),status=document.getElementById("status"),delivery=document.getElementById("delivery");
if(!d?.orderId||!d?.qrData){loading.textContent="Pedido inválido.";throw new Error("Pedido inválido")}
img.src=d.qrDataUrl;img.hidden=false;box.textContent=d.pixCopyPaste||d.qrData;box.hidden=false;copy.hidden=false;loading.hidden=true;
copy.onclick=async()=>{await navigator.clipboard.writeText(d.pixCopyPaste||d.qrData);copy.textContent="PIX copiado ✓";setTimeout(()=>copy.textContent="Copiar PIX",1800)};
let done=false;
async function jsonResponse(r){const raw=await r.text();let x={};try{x=JSON.parse(raw)}catch{throw new Error(r.ok?"Resposta inválida do servidor.":`Servidor respondeu HTTP ${r.status}.`)}if(!r.ok)throw new Error(x.error||`Servidor respondeu HTTP ${r.status}.`);return x}
async function check(){if(done)return;try{const r=await fetch("/api/order?id="+encodeURIComponent(d.orderId),{cache:"no-store"});const x=await jsonResponse(r);if(x.paid){done=true;status.className="status success";status.textContent="Pagamento aprovado ✓";const rr=await fetch("/api/deliver",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({orderId:d.orderId})});const y=await jsonResponse(rr);delivery.hidden=false;delivery.innerHTML=`<div class="status success"><b>Entrega liberada</b><div class="code">${String(y.code||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}</div></div>`}else status.textContent="Aguardando pagamento… "+(x.statusDetail||"")}catch(e){if(!done&&e?.message)status.textContent="Aguardando confirmação…"}}
check();const t=setInterval(check,5000);setTimeout(()=>clearInterval(t),30*60*1000);
</script></body></html>
