<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico • SamSolution</title><style>body{font-family:system-ui;background:#080a0f;color:#fff;max-width:900px;margin:40px auto;padding:20px}pre{background:#11151d;padding:16px;border-radius:12px;white-space:pre-wrap;line-height:1.5}.ok{color:#7ff0b2}.bad{color:#ff9eae}button{padding:12px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer}</style></head><body><h1>Diagnóstico SamSolution</h1><p>Teste o Vercel antes de divulgar a loja.</p><button onclick="run()">Testar APIs</button><pre id="out">Clique em Testar APIs.</pre><script>async function one(path,opt){try{const r=await fetch(path,{cache:'no-store',credentials:'include',...opt});const t=await r.text();return path+' → HTTP '+r.status+'\n'+t}catch(e){return path+' → FALHA\n'+e.message}}async function run(){const out=[];out.push(await one('/api/health'));const token=sessionStorage.getItem('samsolution_admin_token')||'';out.push(await one('/api/admin-check',token?{headers:{Authorization:'Bearer '+token}}:{}));document.getElementById('out').textContent=out.join('\n\n')}</script></body></html>
